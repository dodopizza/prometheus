name: CI

on:
  push:

permissions:
  contents: read
  packages: write

jobs:
  default:
    name: Default
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goyacc
        run: make install-goyacc

      - name: Install UI dependencies
        run: make ui-install

      - name: Run tests
        run: make test

      - name: Build docker image
        run: |
          make promu
          promu crossbuild -p linux/amd64
          make npm_licenses
          make common-docker-amd64
          docker image list

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag and push to GHCR
        run: |
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TARGET="ghcr.io/dodopizza/prometheus:${BRANCH}-${SHORT_SHA}"
          docker tag "prom/prometheus-linux-amd64:${BRANCH}" "${TARGET}"
          docker push "${TARGET}"